<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音檔練習器">
<meta name="theme-color" content="#2B59C3">
<title>音檔練習器</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF0F2;--card:#fff;--ink:#17202B;--mute:#66727F;--line:#D5DAE0;--acc:#2B59C3;--onacc:#fff;--mark:#F5B700;--loop:rgba(20,150,140,.28);--loopln:#14968C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--card:#1B2129;--ink:#E8ECF0;--mute:#8E9AA7;--line:#2C3540;--acc:#6B93F0;--onacc:#0D1117;--loop:rgba(60,200,190,.28);--loopln:#3CC8BE}}
:root[data-theme="dark"]{--bg:#12161C;--card:#1B2129;--ink:#E8ECF0;--mute:#8E9AA7;--line:#2C3540;--acc:#6B93F0;--onacc:#0D1117;--loop:rgba(60,200,190,.28);--loopln:#3CC8BE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px;display:grid;gap:12px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
button,select,.pick{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
button:active{filter:brightness(.92)}
button:focus-visible,select:focus-visible,input:focus-visible,#tl:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pick{display:inline-flex;align-items:center;background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
#title{font-weight:600;overflow-wrap:anywhere;min-height:1.4em}
#tl{position:relative;height:44px;margin:12px 0 4px;touch-action:none;cursor:pointer}
#tl::before{content:"";position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:var(--line)}
#fill{position:absolute;left:0;top:19px;height:6px;border-radius:3px;background:var(--acc);width:0}
#reg{position:absolute;top:10px;height:24px;background:var(--loop);border-left:2px solid var(--loopln);border-right:2px solid var(--loopln);display:none}
.tick{position:absolute;top:6px;width:3px;height:32px;margin-left:-1px;background:var(--mark);border-radius:2px;pointer-events:none}
#knob{position:absolute;top:12px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 0 0 1px var(--acc);left:0}
.times{display:flex;justify-content:space-between;color:var(--mute);font-variant-numeric:tabular-nums}
.transport{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.transport button{padding:0;font-size:15px}
#play{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1 1 100%}
.seg button{padding:0 4px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:15px;margin:0 0 8px}
.ab{color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li.m{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center}
li.m input{min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
li.m button{min-width:44px;padding:0 8px}
.go{font-variant-numeric:tabular-nums;border-color:var(--mark)}
li.t button{width:100%;text-align:left;overflow-wrap:anywhere;padding:10px 12px;height:auto}
li.t button[aria-current=true]{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.empty{color:var(--mute);margin:0}
.note{color:var(--mute);font-size:13px;margin:0}
.pick.alt{background:var(--bg);color:var(--ink);border-color:var(--line)}
.bc{color:var(--mute);overflow-wrap:anywhere;flex:1}
#files{max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
#files button{width:100%;text-align:left;height:auto;min-height:44px;padding:8px 12px;overflow-wrap:anywhere}
#files .d button{font-weight:600}
#files button[aria-current=true]{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
button:disabled{opacity:.4}
</style>
</head>
<body>
<main>
<header><h1>音檔練習器</h1></header>

<section id="browser">
<div class="row">
<label class="pick">選擇資料夾<input type="file" id="fd" webkitdirectory multiple hidden></label>
<label class="pick alt">選擇音檔<input type="file" id="f" accept="audio/*" multiple hidden></label>
</div>
<div class="row" style="margin:10px 0 6px">
<button id="up" aria-label="回上一層">↑ 上一層</button><span id="bc" class="bc">/</span>
</div>
<ul id="files"></ul>
</section>

<section>
<div id="title">尚未選擇音檔</div>
<div id="tl" role="slider" aria-label="播放位置" tabindex="0"><div id="reg"></div><div id="fill"></div><div id="ticks"></div><div id="knob"></div></div>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
</section>

<section>
<div class="transport">
<button id="prevT" aria-label="上一首">⏮</button>
<button id="b10" aria-label="倒退10秒">−10</button>
<button id="play" aria-label="播放或暫停">▶</button>
<button id="stop" aria-label="停止">■</button>
<button id="f10" aria-label="快轉10秒">+10</button>
<button id="nextT" aria-label="下一首">⏭</button>
</div>
<div class="row" style="margin-top:10px">
<label for="spd">速度</label>
<select id="spd"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
</div>
</section>

<section>
<h2>循環</h2>
<div class="row">
<div class="seg" id="modes">
<button data-m="seq">順序播放</button><button data-m="one">單曲循環</button><button data-m="all">全部循環</button><button data-m="ab">A-B 循環</button>
</div>
<button id="setA">設 A 點</button><button id="setB">設 B 點</button><button id="clrAB">清除 A-B</button>
<span class="ab" id="abl">A — · B —</span>
</div>
</section>

<section>
<div class="row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">標記</h2>
<button id="pm" aria-label="上一個標記">◀</button><button id="addM">在此標記</button><button id="nm" aria-label="下一個標記">▶</button></div>
<ul id="marks"></ul>
</section>

<section>
<h2>目前連續播放（同一資料夾）</h2>
<ul id="tracks"></ul>
<p class="note" style="margin-top:10px">音檔不會儲存在 App 內，每次開啟需重新選擇；標記與 A-B 點會依檔名與大小自動記住。</p>
</section>
</main>
<audio id="au" playsinline preload="auto"></audio>

<script>
const $=s=>document.querySelector(s),au=$('#au');
let list=[],idx=-1,mode='seq',A=null,B=null,marks=[],url=null,raf=0;
const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const key=()=>list[idx]?'ap:'+list[idx].name+'|'+list[idx].size:null;
function save(){const k=key();if(!k)return;try{localStorage.setItem(k,JSON.stringify({marks,A,B}))}catch(e){}}
function restore(){marks=[];A=B=null;const k=key();try{const d=JSON.parse(localStorage.getItem(k)||'null');if(d){marks=d.marks||[];A=d.A;B=d.B}}catch(e){}}
function go(){au.play().catch(()=>{})}
function load(i,play){
  if(i<0||i>=list.length)return;idx=i;if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(list[i]);au.src=url;rate();restore();
  $('#title').textContent=list[i].name;meta();render();if(play)go();
}
function rate(){au.defaultPlaybackRate=au.playbackRate=+$('#spd').value}
function skip(d){au.currentTime=Math.min(Math.max(0,au.currentTime+d),au.duration||0);ui()}
function chk(){if(mode==='ab'&&A!=null&&B!=null&&B>A&&au.currentTime>=B)au.currentTime=A}
function ui(){
  const d=au.duration||0,p=d?au.currentTime/d*100:0;
  $('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(d);
  $('#fill').style.width=p+'%';$('#knob').style.left=p+'%';
}
function tick(){chk();ui();raf=au.paused?0:requestAnimationFrame(tick)}
au.onplay=()=>{$('#play').textContent='❚❚';cancelAnimationFrame(raf);tick()};
au.onpause=()=>{$('#play').textContent='▶'};
au.ontimeupdate=()=>{chk();ui()};
au.onloadedmetadata=()=>render();
au.onended=()=>{
  if(mode==='one'||(mode==='ab'&&A!=null)){au.currentTime=mode==='ab'?A:0;go()}
  else if(idx<list.length-1)load(idx+1,1);
  else if(mode==='all')load(0,1);
};
function meta(){
  if(!('mediaSession' in navigator)||idx<0)return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:list[idx].name})}catch(e){}
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',go);h('pause',()=>au.pause());h('seekbackward',()=>skip(-10));h('seekforward',()=>skip(10));
  h('previoustrack',()=>load(idx-1,1));h('nexttrack',()=>load(idx+1,1));
}
function setA(t){A=t;if(B!=null&&B<=A)B=null;save();render()}
function setB(t){if(A==null)A=0;if(t>A){B=t;save();render()}}
function render(){
  ui();renderBrowser();const d=au.duration||0;
  $('#ticks').innerHTML='';
  marks.forEach(m=>{const e=document.createElement('div');e.className='tick';e.style.left=(d?m.t/d*100:0)+'%';$('#ticks').appendChild(e)});
  const r=$('#reg');
  if(A!=null&&d){r.style.display='block';r.style.left=A/d*100+'%';r.style.width=((B!=null?B:d)-A)/d*100+'%'}else r.style.display='none';
  $('#abl').textContent='A '+(A!=null?fmt(A):'—')+' · B '+(B!=null?fmt(B):'—');
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  const ml=$('#marks');ml.innerHTML='';
  if(!marks.length){const p=document.createElement('li');p.className='empty';p.textContent=idx<0?'先選擇音檔，再按「在此標記」。':'還沒有標記。播放時按「在此標記」。';ml.appendChild(p)}
  marks.forEach((m,i)=>{
    const li=document.createElement('li');li.className='m';
    const g=document.createElement('button');g.className='go';g.textContent=fmt(m.t);g.setAttribute('aria-label','跳到標記');g.onclick=()=>{au.currentTime=m.t;ui()};
    const inp=document.createElement('input');inp.value=m.n;inp.setAttribute('aria-label','標記名稱');inp.onchange=()=>{m.n=inp.value;save()};
    const a=document.createElement('button');a.textContent='A';a.setAttribute('aria-label','設為A點');a.onclick=()=>setA(m.t);
    const b=document.createElement('button');b.textContent='B';b.setAttribute('aria-label','設為B點');b.onclick=()=>setB(m.t);
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','刪除標記');x.onclick=()=>{marks.splice(i,1);save();render()};
    li.append(g,inp,a,b,x);ml.appendChild(li);
  });
  const tl=$('#tracks');tl.innerHTML='';
  if(!list.length){const p=document.createElement('li');p.className='empty';p.textContent='從上方瀏覽區點選檔案後，會在此列出同資料夾的曲目。';tl.appendChild(p)}
  list.forEach((f,i)=>{const li=document.createElement('li');li.className='t';const b=document.createElement('button');b.textContent=f.name;if(i===idx)b.setAttribute('aria-current','true');b.onclick=()=>load(i,1);li.appendChild(b);tl.appendChild(li)});
}
const root={dirs:new Map(),files:[]};let cwd=[];
const isAud=f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|flac|ogg|opus|aiff?|caf|mp4)$/i.test(f.name);
const nat=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
function node(path,create){
  let n=root;
  for(const p of path){if(!n.dirs.has(p)){if(!create)return null;n.dirs.set(p,{dirs:new Map(),files:[]})}n=n.dirs.get(p)}
  return n;
}
function addFiles(fs,flat){
  let c=0;
  fs.forEach(f=>{
    if(!isAud(f))return;
    const n=node(flat?['已選檔案']:(f.webkitRelativePath||f.name).split('/').slice(0,-1),true);
    if(!n.files.some(x=>x.name===f.name&&x.size===f.size)){n.files.push(f);c++}
  });
  return c;
}
function playIn(n,f){list=n.files.slice().sort(nat);load(list.indexOf(f),1)}
function renderBrowser(){
  const n=node(cwd)||root,ul=$('#files');ul.innerHTML='';
  $('#bc').textContent='/'+cwd.join('/');$('#up').disabled=!cwd.length;
  const dirs=[...n.dirs.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const fl=n.files.slice().sort(nat);
  if(!dirs.length&&!fl.length){const p=document.createElement('li');p.className='empty';p.textContent=root.dirs.size||root.files.length?'這個資料夾沒有音檔。':'按「選擇資料夾」或「選擇音檔」開始。';ul.appendChild(p)}
  dirs.forEach(d=>{const li=document.createElement('li');li.className='d';const b=document.createElement('button');b.textContent='▸ '+d;b.onclick=()=>{cwd.push(d);renderBrowser()};li.appendChild(b);ul.appendChild(li)});
  fl.forEach(f=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent='♪ '+f.name;if(list[idx]===f)b.setAttribute('aria-current','true');b.onclick=()=>playIn(n,f);li.appendChild(b);ul.appendChild(li)});
}
$('#up').onclick=()=>{cwd.pop();renderBrowser()};
$('#f').onchange=e=>{addFiles(Array.from(e.target.files),true);e.target.value='';cwd=['已選檔案'];renderBrowser()};
$('#fd').onchange=e=>{
  const fs=Array.from(e.target.files);e.target.value='';
  addFiles(fs,false);
  const top=fs.length?(fs[0].webkitRelativePath||'').split('/')[0]:'';
  cwd=top&&root.dirs.has(top)?[top]:[];renderBrowser();
};
$('#play').onclick=()=>{if(idx<0)return;au.paused?go():au.pause()};
$('#stop').onclick=()=>{au.pause();au.currentTime=0;ui()};
$('#b10').onclick=()=>skip(-10);$('#f10').onclick=()=>skip(10);
$('#prevT').onclick=()=>load(idx-1,!au.paused);$('#nextT').onclick=()=>load(idx+1,!au.paused);
$('#spd').onchange=rate;
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
$('#setA').onclick=()=>{if(idx>=0)setA(au.currentTime)};
$('#setB').onclick=()=>{if(idx>=0)setB(au.currentTime)};
$('#clrAB').onclick=()=>{A=B=null;save();render()};
$('#addM').onclick=()=>{if(idx<0)return;marks.push({t:au.currentTime,n:'標記 '+(marks.length+1)});marks.sort((a,b)=>a.t-b.t);save();render()};
$('#pm').onclick=()=>{const p=marks.filter(m=>m.t<au.currentTime-0.5).pop();if(p){au.currentTime=p.t;ui()}};
$('#nm').onclick=()=>{const n=marks.find(m=>m.t>au.currentTime+0.05);if(n){au.currentTime=n.t;ui()}};
const tl=$('#tl');
const seekTo=e=>{const r=tl.getBoundingClientRect();if(au.duration){au.currentTime=au.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));ui()}};
tl.onpointerdown=e=>{tl.setPointerCapture(e.pointerId);seekTo(e)};
tl.onpointermove=e=>{if(tl.hasPointerCapture(e.pointerId))seekTo(e)};
tl.onkeydown=e=>{if(e.key==='ArrowLeft')skip(-5);if(e.key==='ArrowRight')skip(5)};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
